<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exército Brasileiro — Roblox</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet">

<script>

const CONFIG = {

  NOME_GRUPO:   "Exército Brasileiro",
  SLOGAN:       "Feito por | @ducalofc",

  HERO_FUNDO:   "imgs/image.png",
  HERO_TITULO:  "Vivencie a verdadeira experiência Militar dentro do Roblox!\nCom unidades organizadas, Hierarquia Militar, armamentos diversificados e missões estratégicas, trazemos mais ação e sistemas de armamentos otimizados, adentre agora e conheça a verdadeira carreira militar!",
  HERO_DESC:    "Sejam bem-vindos! Somos uma comunidade criada com o objetivo de trazer a experiência do Exército Brasileiro para o Roblox, de forma interativa, organizada e acessível para todas as idades.",

  BTN_VERIFICAR_LINK: "#",
  BTN_DISCORD_LINK:   "#",

  LINK_HOME:       "#hero",
  LINK_COMUNIDADE: "#comunidade",
  LINK_JOGOS:      "#jogos",
  JOGOS: [
    {
      FOTO:  "image.png",
      NOME:  "",
      NOME2: "",
      LINK:  "#jogos",
    },
    {
      FOTO:  "image copy.png",
      NOME:  "",
      NOME2: "",
      LINK:  "#",
    },
    {
      FOTO:  "image copy 2.png",
      NOME:  "",
      NOME2: "",
      LINK:  "#",
    },
  ],

};
</script>

<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', sans-serif;
    background: #1a1a1a;
    color: #fff;
    overflow-x: hidden;
  }

  #hero {
    position: relative;
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .hero-bg {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: 65% center;
    background-repeat: no-repeat;
    filter: brightness(0.45);
  }

  @media (max-width: 600px) {
    .hero-bg {
      background-position: 72% center;
      background-size: 220%;
    }
  }

  .navbar {
    background-color: #0000007d;
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 28px;
  }

  .navbar-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }
  .logo-icon {
    width: 44px; height: 44px;
    border-radius: 8px;
    overflow: hidden;
    background: #2d7a1b;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid rgba(255,255,255,0.15);
  }
  .logo-icon svg { width: 36px; height: 36px; }

  .navbar-links {
    display: flex;
    gap: 2rem;
    list-style: none;
  }
  .navbar-links a {
    color: rgba(255,255,255,0.9);
    text-decoration: none;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    transition: color 0.2s;
  }
  .navbar-links a:hover { color: #7ed64a; }

  .hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
  }
  .hamburger span { display: block; width: 24px; height: 2px; background: #fff; border-radius: 2px; }

  .hero-content {
    position: relative;
    z-index: 5;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 0 28px 36px;
    max-width: 780px;
  }

  .hero-title {
    font-size: clamp(0.95rem, 1.8vw, 1.45rem);
    font-weight: 900;
    line-height: 1.35;
    color: #fff;
    text-shadow: 0 2px 12px rgba(0,0,0,0.6);
    margin-bottom: 1rem;
  }

  @keyframes wordUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .hero-title .word {
    display: inline-block;
    opacity: 0;
    animation: wordUp 0.45s ease forwards;
  }

  .hero-desc {
    font-size: clamp(0.7rem, 1.2vw, 0.82rem);
    color: rgba(255,255,255,0.65);
    line-height: 1.65;
    font-weight: 400;
    max-width: 560px;
    opacity: 0;
    animation: wordUp 0.45s ease forwards;
  }

  .action-bar {
    position: relative;
    z-index: 5;
    background: #7ed64a;
    padding: 0 28px;
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
    min-height: 72px;
  }

  .action-group {
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 1;
    min-width: 200px;
  }

  .action-icon {
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .action-icon svg { width: 28px; height: 28px; }

  .action-text {
    font-size: 0.78rem;
    color: #1a1a1a;
    font-weight: 500;
  }

  .action-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #111;
    color: #fff;
    font-size: 0.7rem;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 9px 22px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.2s, transform 0.15s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .action-btn:hover { background: #222; transform: translateY(-1px); }

  .action-divider {
    width: 1px; height: 40px;
    background: rgba(0,0,0,0.2);
    flex-shrink: 0;
  }

  #jogos {
    background: #232323;
    padding: 3.5rem 28px 4rem;
  }

  .jogos-title {
    font-family: 'Inter', sans-serif;
    font-size: clamp(1.6rem, 4vw, 2.2rem);
    font-weight: 700;
    color: #fff;
    text-align: center;
    margin-bottom: 2rem;
  }

  .jogos-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 16px;
    max-width: 1100px;
    margin: 0 auto;
  }

  .jogo-card {
    border-radius: 10px;
    overflow: hidden;
    position: relative;
    aspect-ratio: 16/10;
    background: #333;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    text-decoration: none;
    display: block;
  }
  .jogo-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 32px rgba(0,0,0,0.5);
  }

  .jogo-img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    position: absolute;
    inset: 0;
  }

  .jogo-placeholder {
    position: absolute;
    inset: 0;
    background: linear-gradient(160deg, #1a3a10 0%, #2d5a1b 60%, #0d2208 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .jogo-placeholder span {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1rem;
    letter-spacing: 0.2em;
    color: rgba(255,255,255,0.2);
    text-transform: uppercase;
  }

  .jogo-overlay {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 40px 14px 12px;
    background: linear-gradient(to top, rgba(0,0,0,0.88) 0%, transparent 100%);
    text-align: center;
  }

  .jogo-nome1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(1.1rem, 2.5vw, 1.5rem);
    letter-spacing: 0.08em;
    color: #7ed64a;
    text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 0 2px 8px rgba(0,0,0,0.8);
    display: block;
    line-height: 1;
  }
  .jogo-nome2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(0.9rem, 2vw, 1.2rem);
    letter-spacing: 0.1em;
    color: #f4d03f;
    text-shadow: 1px 1px 0 #000, -1px -1px 0 #000;
    display: block;
    line-height: 1.2;
  }

  footer {
    background: #111;
    padding: 1.2rem 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
    border-top: 2px solid #7ed64a;
  }

  .footer-left {
    font-size: 0.78rem;
    color: rgba(255,255,255,0.4);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .footer-left a { color: #7ed64a; text-decoration: none; font-weight: 600; }

  .footer-links {
    display: flex; gap: 1.8rem; list-style: none;
  }
  .footer-links a {
    color: rgba(255,255,255,0.5);
    text-decoration: none;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transition: color 0.2s;
  }
  .footer-links a:hover { color: #7ed64a; }

  @media (max-width: 600px) {
    .navbar-links {
      display: none;
      flex-direction: column;
      gap: 0;
      position: fixed;
      inset: 0;
      background: #0000007d;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }
    .navbar-links.open { display: flex; }
    .navbar-links a { font-size: 1.2rem; padding: 1rem 2rem; }
    .hamburger { display: flex; z-index: 1000; }
    .action-bar { flex-direction: column; padding: 14px 20px; gap: 10px; }
    .action-divider { display: none; }
    .action-group { width: 100%; justify-content: space-between; }
    footer { flex-direction: column; text-align: center; }
    .footer-links { justify-content: center; }
  }
</style>
</head>
<body>

<section id="hero">
  <div class="hero-bg" id="heroBg"></div>

  <nav class="navbar">
    <a href="#" class="navbar-logo">
      <div class="logo-icon">
        <svg viewBox="0 0 36 36" fill="none">
          <circle cx="18" cy="18" r="16" fill="#1a5a0d" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
          <polygon points="18,5 30,18 18,31 6,18" fill="#f4d03f" opacity="0.95"/>
          <circle cx="18" cy="18" r="6" fill="#1a3a8f"/>
          <text x="18" y="21.5" text-anchor="middle" font-family="sans-serif" font-size="6" font-weight="900" fill="#fff">EB</text>
        </svg>
      </div>
    </a>

    <ul class="navbar-links" id="navLinks">
      <li><a id="link-home" href="#">HOME</a></li>
      <li><a id="link-comunidade" href="#">COMUNIDADE</a></li>
      <li><a id="link-jogos" href="#">JOGOS</a></li>
    </ul>

    <div class="hamburger" id="hamburger">
      <span></span><span></span><span></span>
    </div>
  </nav>

  <div class="hero-content">
    <h1 class="hero-title" id="heroTitulo"></h1>
    <p class="hero-desc" id="heroDesc"></p>
  </div>

  <div class="action-bar" id="comunidade">
    <div class="action-group">
      <div class="action-icon">
        <svg viewBox="0 0 28 28" fill="none">
          <rect width="28" height="28" rx="6" fill="#111"/>
          <circle cx="14" cy="11" r="5" fill="#fff" opacity="0.9"/>
          <rect x="7" y="18" width="14" height="3" rx="1.5" fill="#fff" opacity="0.9"/>
          <circle cx="14" cy="11" r="2.5" fill="#111"/>
          <path d="M12 10.5l1.5 1.5 3-3" stroke="#7ed64a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="action-text">Grupo do Roblox</span>
      <a id="btnVerificar" href="https://www.roblox.com/pt/communities/33137419/RV2-Revolu-o-21-Setembro#!/about" class="action-btn">ENTRAR</a>
    </div>
    <div class="action-divider"></div>
    <div class="action-group">
      <div class="action-icon">
        <svg viewBox="0 0 28 28" fill="none">
          <rect width="28" height="28" rx="6" fill="#5865F2"/>
          <path d="M20.5 8.4A17.3 17.3 0 0 0 16.7 7c-.16.3-.35.7-.48 1a15.9 15.9 0 0 0-4.44 0A10.7 10.7 0 0 0 7.5 8.4C5.1 12 4.48 15.5 4.76 18.9c1.58 1.2 3.1 1.94 4.6 2.41.37-.52.7-1.07.99-1.66-.54-.2-1.06-.46-1.55-.77.13-.1.26-.2.38-.3 2.98 1.4 6.19 1.4 9.14 0 .12.1.25.2.38.3-.49.31-1 .57-1.55.77.29.59.62 1.14.99 1.66 1.5-.47 3.02-1.2 4.6-2.41.33-4.04-.57-7.5-2.78-10.5zM10.1 17c-.95 0-1.73-.9-1.73-2s.76-2 1.73-2c.97 0 1.74.9 1.73 2 0 1.1-.76 2-1.73 2zm6.8 0c-.95 0-1.73-.9-1.73-2s.76-2 1.73-2c.97 0 1.74.9 1.73 2 0 1.1-.75 2-1.73 2z" fill="white"/>
        </svg>
      </div>
      <span class="action-text">Entre na comunidade</span>
      <a id="btnDiscord" href="https://discord.gg/E39Rrtv4kR" class="action-btn">ENTRAR</a>
    </div>
  </div>
</section>

<section id="jogos">
  <h2 class="jogos-title">Jogos</h2>
  <div class="jogos-grid" id="jogosGrid"></div>
</section>

<footer>
  <div class="footer-left" id="footerSlogan"></div>
  <ul class="footer-links">
    <li><a id="flink-home" href="#">HOME</a></li>
    <li><a id="flink-comunidade" href="#">COMUNIDADE</a></li>
    <li><a id="flink-jogos" href="#">JOGOS</a></li>
  </ul>
</footer>

<script>
window.addEventListener('DOMContentLoaded', () => {
  const C = CONFIG;

  document.getElementById('heroBg').style.backgroundImage = `url('${C.HERO_FUNDO}')`;

  const titleEl = document.getElementById('heroTitulo');
  const rawTitle = C.HERO_TITULO.replace(/\n/g, ' \n ');
  const words = rawTitle.split(' ');
  let html = '';
  let delay = 0;
  words.forEach(w => {
    if (w === '\n') {
      html += '<br>';
    } else {
      html += `<span class="word" style="animation-delay:${delay.toFixed(2)}s">${w}&nbsp;</span>`;
      delay += 0.045;
    }
  });
  titleEl.innerHTML = html;

  const descEl = document.getElementById('heroDesc');
  descEl.textContent = C.HERO_DESC;
  descEl.style.animationDelay = (delay + 0.1).toFixed(2) + 's';

  document.getElementById('btnVerificar').href = C.BTN_VERIFICAR_LINK;
  document.getElementById('btnDiscord').href   = C.BTN_DISCORD_LINK;

  document.getElementById('link-home').href       = C.LINK_HOME;
  document.getElementById('link-comunidade').href = C.LINK_COMUNIDADE;
  document.getElementById('link-jogos').href      = C.LINK_JOGOS;

  document.getElementById('flink-home').href       = C.LINK_HOME;
  document.getElementById('flink-comunidade').href = C.LINK_COMUNIDADE;
  document.getElementById('flink-jogos').href      = C.LINK_JOGOS;

  const parts = C.SLOGAN.split('|');
  document.getElementById('footerSlogan').innerHTML =
    parts.length === 2
      ? `<span>${parts[0].trim()}</span><span style="color:rgba(255,255,255,0.2)">|</span><a href="#">${parts[1].trim()}</a>`
      : `<span>${C.SLOGAN}</span>`;

  const grid = document.getElementById('jogosGrid');
  C.JOGOS.forEach(jogo => {
    const a = document.createElement('a');
    a.href = jogo.LINK;
    a.className = 'jogo-card';

    if (jogo.FOTO && jogo.FOTO.trim() !== '') {
      const img = document.createElement('img');
      img.src = jogo.FOTO;
      img.alt = jogo.NOME;
      img.className = 'jogo-img';
      img.onerror = () => { img.style.display = 'none'; placeholder.style.display = 'flex'; };
      a.appendChild(img);
    }

    const placeholder = document.createElement('div');
    placeholder.className = 'jogo-placeholder';
    placeholder.style.display = (jogo.FOTO && jogo.FOTO.trim() !== '') ? 'none' : 'flex';
    placeholder.innerHTML = `<span>Sem imagem</span>`;
    a.appendChild(placeholder);

    const overlay = document.createElement('div');
    overlay.className = 'jogo-overlay';
    overlay.innerHTML = `
      <span class="jogo-nome1">${jogo.NOME}</span>
      ${jogo.NOME2 ? `<span class="jogo-nome2">${jogo.NOME2}</span>` : ''}
    `;
    a.appendChild(overlay);
    grid.appendChild(a);
  });

  document.getElementById('hamburger').addEventListener('click', () => {
    document.getElementById('navLinks').classList.toggle('open');
  });
  document.querySelectorAll('#navLinks a').forEach(l =>
    l.addEventListener('click', () => document.getElementById('navLinks').classList.remove('open'))
  );
});
</script>
</body>
</html>
